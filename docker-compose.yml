services:
  fuseki:
    container_name: fuseki
    hostname: fuseki
    restart: unless-stopped
    image: stain/jena-fuseki:5.1.0
    environment:
      - ADMIN_PASSWORD=$ADMIN_PASSWORD
      - JAVA_OPTIONS=-Xmx2g -Xms1g
    ports:
      - ${FUSEKI_PORT:-9030}:3030
    volumes:
      - fuseki-data:/fuseki
    networks:
      - traefik
    user: 'fuseki:fuseki'

  fuseki-cache:
    hostname: fuseki-cache
    container_name: fuseki-cache
    restart: unless-stopped
    image: varnish
    ports:
      - ${CACHE_PORT:-9031}:80
    volumes:
      - type: bind
        source: ./config/varnish-default.vcl
        target: /etc/varnish/default.vcl
    networks:
      - traefik

  skosmos:
    container_name: skosmos
    restart: unless-stopped
    image: ${IMAGE:-ghcr.io/odissei-data/sd-skosmos-fork:v3.4-php8.2.35@sha256:439f5880daeae76f19598bd572ba87a035193e8de0f86cb0ada9086aba4bb339}
    environment:
      - ADMIN_PASSWORD=$ADMIN_PASSWORD
      - SPARQL_ENDPOINT=http://fuseki:3030/skosmos/sparql
      - DATA=${DATA:-/data}
    networks:
      - traefik
    ports:
      - '9090:80' #adapt as needed on portainer
    volumes:
      - ./data:/data
      - skosmos-configuration:/config
    depends_on:
      - fuseki
      - skosmos-loader
  skosmos-loader:
    container_name: skosmos-loader
    restart: unless-stopped
    image: ghcr.io/odissei-data/sd-skosmos-fork-loader:v3.4-php8.2.35@sha256:dc077769430b8881e6ad60305d2a3f61d7873728c19abbdffb5fda700844ad18
    environment:
      - ADMIN_PASSWORD=$ADMIN_PASSWORD
      - SPARQL_ENDPOINT=http://fuseki:3030/skosmos/sparql
      - STORE_BASE=http://fuseki:3030/skosmos
      - DATA=${DATA:-/data}
      - DATABASE_TYPE=fuseki
    networks:
      - traefik
    volumes:
      - ./data:/data
      - skosmos-configuration:/config
    depends_on:
      - fuseki
      - fuseki-cache

networks:
  traefik:
    external: true

volumes:
  gl-skosmos:
    external: true
  skosmos-configuration:
    external: false
  fuseki-data:
    name: fuseki-data